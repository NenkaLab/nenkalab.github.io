<header id="main-header" style="--header-height: 100px;--min-header-height: 48px;--font-size: 1.25rem;--bt-o: 100%;--bt-f: 1;--bt-t: 0%;" class="fixed w-full h-(--header-height) min-h-(--min-header-height) top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-zinc-900/80 border-b border-zinc-200/50 dark:border-zinc-700/50">
    <div class="max-w-5xl mx-auto px-4 transition-all duration-300 ease-in-out h-full flex items-center" id="header-container">
        <nav class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <button id="back-button" 
                        onclick="window.history.back()" 
                        class="hidden items-center justify-center w-10 h-10 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all duration-200"
                        aria-label="뒤로가기">
                    <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">arrow_back</span>
                </button>
                
                {% if page.title %}
                <span class="flex flex-col">
                    <a id="header-title-base" href="{{ site.baseurl }}/" class="text-xs flex-(--bt-f) text-zinc-500/(--bt-o) dark:text-zinc-400/(--bt-o) overflow-hidden transition-opacity duration-300 ease-in-out" onclick="">
                        {{ site.title }}
                    </a>
                    <a id="header-title" href="{{ page.url }}" class="leading-[1.1] -translate-(--bt-t) text-zinc-700 dark:text-zinc-300 font-bold hover:opacity-80 transition-[color,font-weight,opacity] duration-300 ease-in-out" style="font-size: var(--font-size);">
                        {{ page.title }}
                    </a>
                </span>
                {% else %}
                <a href="{{ site.baseurl }}/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <span id="header-title" class="text-zinc-700 dark:text-zinc-300 font-bold transition-[color,font-weight] duration-300 ease-in-out" style="font-size: var(--font-size);">
                        {{ site.title }}
                    </span>
                </a>
                {% endif %}
            </div>
            
            <div class="flex items-center gap-4">
                <a href="{{ site.baseurl }}/search/" 
                   class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all duration-200"
                   aria-label="검색">
                    <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">search</span>
                </a>
            </div>
        </nav>
    </div>
</header>

<script>
    (function() {
        const header = document.getElementById('main-header');
        const backButton = document.getElementById('back-button');
        let ticking = false;
        
        const MAX_HEIGHT = 100;
        const MIN_HEIGHT = 48;
        const MAX_FONT_SIZE = 1.375;
        const MIN_FONT_SIZE = 1.125;
        const SCROLL_RANGE = 80;
        
        if (window.history.length > 1) {
            backButton.classList.remove('hidden');
            backButton.classList.add('flex');
        }
        
        function updateHeader() {
            const scrollY = window.scrollY;
            let progress = Math.min(scrollY / SCROLL_RANGE, 1);
            let newHeight = MAX_HEIGHT - (MAX_HEIGHT - MIN_HEIGHT) * progress;
            let newFontSize = MAX_FONT_SIZE - (MAX_FONT_SIZE - MIN_FONT_SIZE) * progress;
            let translateY = 50 - 50 * progress;
            
            header.style.setProperty('--header-height', `${newHeight}px`);
            header.style.setProperty('--font-size', `${newFontSize}rem`);
            header.style.setProperty('--bt-o', `${Math.round(100*(1-progress))}%`);
            header.style.setProperty('--bt-f', `${1-progress}`);
            header.style.setProperty('--bt-t', `${translateY}%`);
            
            ticking = false;
        }
        
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateHeader);
                ticking = true;
            }
        });
        
        updateHeader();
    })();
</script>
