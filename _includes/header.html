<header id="main-header" class="sticky top-0 z-50 transition-all duration-300 ease-in-out backdrop-blur-md bg-white/80 dark:bg-zinc-900/80 border-b border-zinc-200/50 dark:border-zinc-700/50">
    <div class="max-w-5xl mx-auto px-4 transition-all duration-300 ease-in-out py-6" id="header-container">
        <nav class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- 뒤로가기 버튼 (이전 페이지가 있을 때만 표시) -->
                <button id="back-button" 
                        onclick="window.history.back()" 
                        class="hidden items-center justify-center w-10 h-10 rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all duration-200"
                        aria-label="뒤로가기">
                    <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">arrow_back</span>
                </button>
                
                <!-- 로고 -->
                <a href="{{ site.baseurl }}/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <img id="profile-image" 
                         src="{{ site.author.image }}" 
                         alt="{{ site.author.name }}" 
                         class="w-10 h-10 rounded-full border border-zinc-300 dark:border-zinc-600 transition-all duration-300 ease-in-out">
                    <span class="text-xl font-bold transition-all duration-300 ease-in-out">{{ site.title }}</span>
                </a>
            </div>
            
            <!-- 네비게이션 링크 -->
            <div class="flex items-center gap-4">
                <!-- 검색 버튼 -->
                <a href="{{ site.baseurl }}/search/" 
                   class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-all duration-200"
                   aria-label="검색">
                    <span class="material-symbols-outlined text-zinc-700 dark:text-zinc-300">search</span>
                </a>
            </div>
        </nav>
    </div>
</header>

<style>
    /* 스크롤시 적용될 스타일 */
    #main-header.scrolled #header-container {
        padding-top: 0.5rem; /* py-2 */
        padding-bottom: 0.5rem;
    }
    
    #main-header.scrolled #profile-image {
        width: 0;
        height: 0;
        opacity: 0;
        margin: 0;
        border-width: 0;
    }
    
    #main-header.scrolled .text-xl {
        font-size: 1.125rem; /* text-lg */
    }
</style>

<script>
    (function() {
        const header = document.getElementById('main-header');
        const backButton = document.getElementById('back-button');
        let lastScrollY = window.scrollY;
        let ticking = false;
        
        // 뒤로가기 버튼 표시 로직
        if (window.history.length > 1) {
            backButton.classList.remove('hidden');
            backButton.classList.add('flex');
        }
        
        // 스크롤 이벤트 핸들러
        function updateHeader() {
            const scrollY = window.scrollY;
            
            // 50px 이상 스크롤시 작아진 헤더 적용
            if (scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScrollY = scrollY;
            ticking = false;
        }
        
        // 스크롤 이벤트 리스너 (requestAnimationFrame으로 최적화)
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateHeader);
                ticking = true;
            }
        });
        
        // 초기 상태 설정
        updateHeader();
    })();
</script>
