            </div>
            
            <!-- Info -->

            </div>
            
            <!-- Top-Right Controls -->

                </button>
                <button id="viewer-hide-controls" class="w-10 h-10 flex items-center justify-center rounded-full group hover:bg-white hover:bg-opacity-10 transition-colors" aria-label="UI 가리기" title="UI 가리기">

    <!-- (수정) Image Container: 뷰어 코어가 이곳에 동적으로 이미지들을 생성합니다 -->

        <!-- JS가 여기에 .viewer-image-instance-wrapper 들을 동적으로 생성 -->
    </div>
    
    <!-- Next Button -->
    <button id="viewer-next" class="control-hide absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 flex items-center justify-center rounded-full bg-white bg-opacity-10 hover:bg-opacity-100 transition-colors z-10" aria-label="다음 이미지" title="다음 (→)">

        <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div>
    </div>

<!-- (수정) Styles -->
<style>
@keyframes spin { to { transform: rotate(360deg); } }
.animate-spin { animation: spin 1s linear infinite; }

/* (신규) 동적으로 생성될 이미지 래퍼 스타일 */
.viewer-image-instance-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem; /* p-4와 동일 */
    box-sizing: border-box; /* 패딩이 크기에 포함되도록 */
    opacity: 0;
    /* (수정) View Transition API가 opacity를 제어하므로, CSS transition 제거 */
    will-change: opacity;
    pointer-events: none; /* 활성화된 이미지만 이벤트 받도록 */
}
.viewer-image-instance-wrapper.active {
    opacity: 1;
    pointer-events: auto;
}
.viewer-zoom-target { 
    /* 줌/패닝/회전이 적용될 대상 */
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
    will-change: transform, filter;
    max-width: 100%;
    max-height: 100%;
    display: flex; /* 이미지를 중앙에 유지 */
    align-items: center;
    justify-content: center;
}
.viewer-zoom-target.zooming { 
    /* 핀치 줌 또는 패닝 중에는 transition 제거 */
    transition: none; 
}
.viewer-image-instance { 
    /* 실제 이미지 */
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-contain: contain;
    select: none;
    user-select: none;
    -webkit-user-drag: none;
    transition: filter 0.1s ease, image-rendering 0.1s;
    will-change: filter, image-rendering;
    display: block;
}

/* Filter Menu, Slider, Control hide 스타일 (원본과 동일) */
#viewer-filter-menu { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.3) transparent; }
#viewer-filter-menu::-webkit-scrollbar { width: 8px; }
#viewer-filter-menu::-webkit-scrollbar-track { background: transparent; }
#viewer-filter-menu::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.3); border-radius: 4px; }
#viewer-filter-menu::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.5); }

.slider::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    cursor: pointer;
    transform: translateY(-4px);
}
.slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    cursor: pointer;
    border: none;
    transform: translateY(-4px);
}
.slider::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 4px;
    background: #374151;
}
.slider::-moz-range-track {
    height: 8px;
    border-radius: 4px;
    background: #374151;
}

.control-hide.hide {
    will-change: opacity;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* (신규) View Transition API 스타일 */
::view-transition-old(viewer-transition),
::view-transition-new(viewer-transition) {
    /* 줌/패닝/회전/필터 상태를 애니메이션 */
    animation-duration: 0.3s;
    animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

::view-transition-image-pair(viewer-transition) {
    /* 기본 크로스페이드 대신 줌/변형 애니메이션 활성화 */
    animation: none;
    mix-blend-mode: normal;
}

</style>
