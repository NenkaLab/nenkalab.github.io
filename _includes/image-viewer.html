<div id="image-viewer-container" class="fixed inset-0 z-[1000] flex h-full w-full items-center justify-center text-white group" style="display: none;">
  
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

  <div id="iv-image-wrapper" class="relative h-full w-full overflow-hidden [&.is-zoomed]:cursor-grabbing" style="cursor: grab;">
    <img id="iv-image-1" alt="" class="absolute left-1/2 top-1/2 max-h-[95%] max-w-[95%] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-200" style="opacity: 0;">
    <img id="iv-image-2" alt="" class="absolute left-1/2 top-1/2 max-h-[95%] max-w-[95%] -translate-x-1/2 -translate-y-1/2 transition-opacity duration-200" style="opacity: 0;">
  </div>

  <div id="iv-top-bar" class="iv-control-bar absolute left-1/2 top-4 w-[90%] max-w-lg -translate-x-1/2 rounded-full bg-zinc-900/30 px-3 py-2 transition-all duration-300 ease-out md:w-auto md:px-4 backdrop-blur-md opacity-100 visible group-[.iv-controls-hidden]:opacity-0 group-[.iv-controls-hidden]:invisible group-[.iv-controls-hidden]:-translate-y-[150%] group-[.iv-controls-hidden]:scale-90">
    <div class="flex items-center justify-between gap-2 md:gap-4">
      <button id="iv-close-left" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">close</span>
      </button>
      <button id="iv-effects-button" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">auto_fix</span>
      </button>
      <div id="iv-page-number" class="iv-capsule-ui flex-shrink-0 cursor-default rounded-full bg-zinc-700/50 px-4 py-2 text-sm font-medium transition-colors duration-150 ease-out hover:bg-zinc-600/70 backdrop-blur">
        1 / 1
      </div>
      <button id="iv-fullscreen-button" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">fullscreen</span>
      </button>
      <button id="iv-close-right" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">close</span>
      </button>
    </div>
  </div>

  <div id="iv-bottom-bar" class="iv-control-bar absolute bottom-4 left-1/2 w-[90%] max-w-lg -translate-x-1/2 rounded-full bg-zinc-900/30 px-3 py-2 transition-all duration-300 ease-out md:w-auto md:px-4 backdrop-blur-md opacity-100 visible group-[.iv-controls-hidden]:opacity-0 group-[.iv-controls-hidden]:invisible group-[.iv-controls-hidden]:translate-y-full group-[.iv-controls-hidden]:scale-90">
    <div class="flex items-center justify-between gap-2 md:gap-3">
      <button id="iv-zoom-out" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">remove</span>
      </button>
      <div id="iv-zoom-percent" class="iv-capsule-ui w-20 cursor-pointer rounded-full bg-zinc-700/50 py-2 text-center text-sm font-medium transition-colors duration-150 ease-out hover:bg-zinc-600/70 backdrop-blur">
        100%
      </div>
      <button id="iv-zoom-in" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">add</span>
      </button>
      
      <div class="mx-1 h-6 w-px bg-white/30 md:mx-2"></div>

      <button id="iv-rotate-left" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">rotate_left</span>
      </button>
      <button id="iv-rotate-reset" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">rotate_90_degrees_ccw</span>
      </button>
      <button id="iv-rotate-right" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">rotate_right</span>
      </button>
      
      <div class="mx-1 h-6 w-px bg-white/30 md:mx-2"></div>

      <button id="iv-position-reset" class="iv-button flex items-center justify-center rounded-full p-2 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">fit_screen</span>
      </button>
    </div>
  </div>

  <button id="iv-prev-button" class="iv-control-bar iv-nav-button absolute left-4 top-1/2 -translate-y-1/2 rounded-full bg-zinc-900/30 p-3 transition-all duration-300 ease-out hover:bg-white/20 backdrop-blur-md opacity-100 visible group-[.iv-controls-hidden]:opacity-0 group-[.iv-controls-hidden]:invisible flex items-center justify-center">
    <span class="material-symbols-outlined text-xl leading-none">arrow_back_ios_new</span>
  </button>
  <button id="iv-next-button" class="iv-control-bar iv-nav-button absolute right-4 top-1/2 -translate-y-1/2 rounded-full bg-zinc-900/30 p-3 transition-all duration-300 ease-out hover:bg-white/20 backdrop-blur-md opacity-100 visible group-[.iv-controls-hidden]:opacity-0 group-[.iv-controls-hidden]:invisible flex items-center justify-center">
    <span class="material-symbols-outlined text-xl leading-none">arrow_forward_ios</span>
  </button>

  <div id="iv-effects-popup" class="absolute left-1/2 top-1/2 z-20 hidden h-[50vh] w-[90%] max-w-sm -translate-x-1/2 -translate-y-1/2 flex-col rounded-lg bg-zinc-800 shadow-xl">
    <div class="flex items-center justify-between p-4">
      <h3 class="text-lg font-medium">이미지 효과</h3>
      <button id="iv-effects-close-btn" class="iv-button -mr-1 flex items-center justify-center rounded-full p-1 transition-colors duration-150 ease-out hover:bg-white/20">
        <span class="material-symbols-outlined text-2xl leading-none">close</span>
      </button>
    </div>
    
    <div class="flex-grow overflow-y-auto px-4 pb-4">
      <div id="iv-effects-list" class="flex flex-col gap-4">
      </div>

      <div class="mt-4 flex flex-col gap-4 border-t border-zinc-700 pt-4">
        <div>
          <label class="text-sm font-medium">렌더링</label>
          <div id="iv-render-mode" class="mt-2 grid grid-cols-3 gap-2">
            <button data-value="default" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">기본</button>
            <button data-value="vivid" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">선명</button>
            <button data-value="pixelated" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">픽셀</button>
          </div>
        </div>
        <div>
          <label class="text-sm font-medium">품질</label>
          <div id="iv-quality-mode" class="mt-2 grid grid-cols-2 gap-2">
            <button data-value="performance" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">성능</button>
            <button data-value="quality" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">품질</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-auto flex flex-col gap-2 border-t border-zinc-700 p-4 pt-4">
      <button id="iv-effect-reset-current" class="w-full rounded-md bg-zinc-600 px-3 py-2 text-sm hover:bg-zinc-500">
        현재 이미지 초기화
      </button>
      <button id="iv-effect-apply-all" class="w-full rounded-md bg-blue-600 px-3 py-2 text-sm hover:bg-blue-500">
        전체 이미지에 적용
      </button>
      <button id="iv-effect-reset-all" class="w-full rounded-md bg-red-600 px-3 py-2 text-sm hover:bg-red-500">
        전체 초기화
      </button>
    </div>
  </div>

</div>


<script src="{{ '/assets/js/image-viewer.js' | relative_url }}" defer></script>
