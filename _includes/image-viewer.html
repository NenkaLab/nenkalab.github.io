<!-- 이미지 뷰어 HTML 구조 -->
<!-- Jekyll 레이아웃의 body 태그 끝 직전에 추가하세요 -->

<style>
/* View Transition API 애니메이션 
   Chrome 111+, Edge 111+, Safari 18+에서 작동
   미지원 브라우저는 자동으로 일반 전환으로 폴백 */
@supports (view-transition-name: none) {
    /* 이미지 전환 애니메이션 */
    ::view-transition-old(image-old),
    ::view-transition-new(image-new) {
        animation-duration: 0.3s;
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    ::view-transition-old(image-old) {
        animation-name: fade-out;
    }
    
    ::view-transition-new(image-new) {
        animation-name: fade-in;
    }
    
    /* 본문 <-> 뷰어 전환 애니메이션 */
    ::view-transition-old(active-image),
    ::view-transition-new(active-image) {
        animation-duration: 0.4s;
        animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    /* 이미지 크기와 위치 애니메이션 */
    ::view-transition-old(active-image),
    ::view-transition-new(active-image) {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    
    @keyframes fade-out {
        from {
            opacity: 1;
        }
        to {
            opacity: 0;
        }
    }
    
    @keyframes fade-in {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
}

/* 이미지 스택 기본 전환 (View Transition 미지원 시) */
.image-stack-item {
    transition: opacity 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
</style>

<div id="image-viewer" class="hidden fixed inset-0 bg-black/95 z-[9999] flex-col">
