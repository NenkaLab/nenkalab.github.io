<div id="image-viewer-container" class="fixed inset-0 z-[1000] hidden h-full w-full flex-col items-center justify-center bg-black/80 text-white" style="touch-action: none;">

  <div id="iv-image-wrapper" class="absolute inset-0 h-full w-full cursor-grab overflow-hidden">
    <img id="iv-image-1" class="absolute left-1/2 top-1/2 h-auto w-auto max-w-[95%] max-h-[95%] translate-x-[-50%] translate-y-[-50%] opacity-0 transition-opacity duration-300" style="will-change: transform;" />
    <img id="iv-image-2" class="absolute left-1/2 top-1/2 h-auto w-auto max-w-[95%] max-h-[95%] translate-x-[-50%] translate-y-[-50%] opacity-0 transition-opacity duration-300" style="will-change: transform;" />
  </div>

  <div id="iv-top-bar" class="iv-control-bar absolute top-4 z-10 mx-auto flex w-[90%] max-w-sm items-center justify-between gap-2 rounded-xl bg-zinc-900/30 p-2 backdrop-blur-md transition-transform duration-300">
    <button id="iv-close-left" class="iv-button rounded-full p-2 hover:bg-white/20">
      <span class="material-symbols-outlined">close</span>
    </button>
    
    <div id="iv-page-number" class="flex-shrink-0 rounded-full bg-black/20 px-4 py-2 text-sm font-medium backdrop-blur-sm">
      1 / 10
    </div>

    <div class="flex items-center gap-2">
      <button id="iv-effects-button" class="iv-button rounded-full p-2 hover:bg-white/20">
        <span class="material-symbols-outlined">tune</span>
      </button>
      <button id="iv-fullscreen-button" class="iv-button rounded-full p-2 hover:bg-white/20">
        <span class="material-symbols-outlined">fullscreen</span>
      </button>
      <button id="iv-close-right" class="iv-button rounded-full p-2 hover:bg-white/20">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>

  <button id="iv-prev-button" class="iv-control-bar iv-button absolute left-2 top-1/2 z-10 -translate-y-1/2 rounded-full bg-zinc-900/30 p-2 backdrop-blur-md transition-all duration-300 hover:bg-white/20 md:left-4 md:p-3">
    <span class="material-symbols-outlined">arrow_back_ios_new</span>
  </button>
  <button id="iv-next-button" class="iv-control-bar iv-button absolute right-2 top-1/2 z-10 -translate-y-1/2 rounded-full bg-zinc-900/30 p-2 backdrop-blur-md transition-all duration-300 hover:bg-white/20 md:right-4 md:p-3">
    <span class="material-symbols-outlined">arrow_forward_ios</span>
  </button>

  <div id="iv-bottom-bar" class="iv-control-bar absolute bottom-4 z-10 mx-auto flex w-[90%] max-w-2xl flex-wrap items-center justify-center gap-2 rounded-xl bg-zinc-900/30 p-2 backdrop-blur-md transition-transform duration-300">
    <div class="flex items-center gap-1 rounded-full bg-black/20 p-1 backdrop-blur-sm">
      <button id="iv-zoom-out" class="iv-button rounded-full p-2 hover:bg-white/20">
        <span class="material-symbols-outlined">remove</span>
      </button>
      <div id="iv-zoom-percent" class="cursor-pointer rounded-full px-3 py-1.5 text-sm font-medium hover:bg-white/20" title="줌 초기화 (클릭)">
        100%
      </div>
      <button id="iv-zoom-in" class="iv-button rounded-full p-2 hover:bg-white/20">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>
    
    <div class="flex items-center gap-1 rounded-full bg-black/20 p-1 backdrop-blur-sm">
      <button id="iv-rotate-left" class="iv-button rounded-full p-2 hover:bg-white/20" title="시계 반대 방향 회전 (Ctrl+클릭: 10도)">
        <span class="material-symbols-outlined">rotate_left</span>
      </button>
      <button id="iv-rotate-reset" class="iv-button rounded-full p-2 hover:bg-white/20" title="회전 초기화">
        <span class="material-symbols-outlined">refresh</span>
      </button>
      <button id="iv-rotate-right" class="iv-button rounded-full p-2 hover:bg-white/20" title="시계 방향 회전 (Ctrl+클릭: 10도)">
        <span class="material-symbols-outlined">rotate_right</span>
      </button>
    </div>

    <div class="flex items-center gap-1 rounded-full bg-black/20 p-1 backdrop-blur-sm">
      <button id="iv-position-reset" class="iv-button rounded-full p-2 hover:bg-white/20" title="위치 초기화">
        <span class="material-symbols-outlined">center_focus_strong</span>
      </button>
    </div>
  </div>

  <div id="iv-effects-popup" class="absolute z-20 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 hidden w-[90%] max-w-sm rounded-lg bg-zinc-800 p-4 shadow-xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-medium">이미지 효과</h3>
      <button id="iv-effects-close-btn" class="iv-button rounded-full p-1 -mr-1 hover:bg-white/20">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div id="iv-effects-list" class="flex flex-col gap-4">
    </div>

    <div class="mt-6 flex flex-col gap-4 border-t border-zinc-700 pt-4">
      <div>
        <label class="text-sm font-medium">렌더링</label>
        <div id="iv-render-mode" class="mt-2 flex flex-wrap gap-2">
          <button data-value="default" class="iv-option-btn iv-btn-active rounded-md bg-blue-600 px-3 py-1 text-sm">기본</button>
          <button data-value="vivid" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">선명</button>
          <button data-value="pixelated" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">픽셀</button>
        </div>
      </div>
      <div>
        <label class="text-sm font-medium">품질</label>
        <div id="iv-quality-mode" class="mt-2 flex flex-wrap gap-2">
          <button data-value="performance" class="iv-option-btn iv-btn-active rounded-md bg-blue-600 px-3 py-1 text-sm">성능</button>
          <button data-value="quality" class="iv-option-btn rounded-md bg-zinc-600 px-3 py-1 text-sm hover:bg-zinc-500">품질</button>
        </div>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap items-center justify-between gap-2 border-t border-zinc-700 pt-4">
      <button id="iv-effect-reset-current" class="rounded-md bg-zinc-600 px-3 py-1.5 text-sm hover:bg-zinc-500">
        현재 이미지 초기화
      </button>
      <button id="iv-effect-apply-all" class="rounded-md bg-blue-600 px-3 py-1.5 text-sm hover:bg-blue-500">
        전체 이미지에 적용
      </button>
      <button id="iv-effect-reset-all" class="rounded-md bg-red-600 px-3 py-1.5 text-sm hover:bg-red-500">
        전체 초기화
      </button>
    </div>
  </div>

</div>

<style>
  #image-viewer-container.iv-controls-hidden #iv-top-bar {
    transform: translateY(-150%);
  }
  #image-viewer-container.iv-controls-hidden #iv-bottom-bar {
    transform: translateY(150%);
  }
  #image-viewer-container.iv-controls-hidden #iv-prev-button,
  #image-viewer-container.iv-controls-hidden #iv-next-button {
    opacity: 0;
  }
  #iv-image-wrapper.is-zoomed {
    cursor: grab;
  }
  #iv-image-wrapper.is-zoomed:active {
    cursor: grabbing;
  }
  .iv-button {
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>

<script src="{{ '/assets/js/image-viewer.js' | relative_url }}" defer></script>
