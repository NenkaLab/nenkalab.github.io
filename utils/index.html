<script>
    (function() {
        const header = document.getElementById('main-header');
        const backButton = document.getElementById('back-button');
        let lastScrollY = window.scrollY;
        let ticking = false;
        
        // 뒤로가기 버튼 표시 로직
        if (window.history.length > 1) {
            backButton.classList.remove('hidden');
            backButton.classList.add('flex');
        }
        
        // 스크롤 이벤트 핸들러
        function updateHeader() {
            const scrollY = window.scrollY;
            
            // 50px 이상 스크롤시 작아진 헤더 적용
            if (scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScrollY = scrollY;
            ticking = false;
        }
        
        // 스크롤 이벤트 리스너 (requestAnimationFrame으로 최적화)
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateHeader);
                ticking = true;
            }
        });
        
        // 초기 상태 설정
        updateHeader();
    })();
</script>

<script>
(function() {
    const themeToggle = document.getElementById('theme-toggle');
    const themeMenu = document.getElementById('theme-menu');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const themeButtons = document.querySelectorAll('[data-theme]');
    
    const themes = {
        light: { icon: 'light_mode', text: 'Light' },
        dark: { icon: 'dark_mode', text: 'Dark' },
        system: { icon: 'contrast', text: 'System' }
    };
    
    // 현재 테마 가져오기
    function getCurrentTheme() {
        return localStorage.getItem('theme') || 'system';
    }
    
    // 시스템 다크모드 감지
    function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    // 실제 적용될 테마 (system이면 시스템 설정 따름)
    function getEffectiveTheme(theme) {
        return theme === 'system' ? getSystemTheme() : theme;
    }
    
    // 테마 적용
    function applyTheme(theme) {
        const effectiveTheme = getEffectiveTheme(theme);
        
        if (effectiveTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // UI 업데이트
        themeIcon.textContent = themes[theme].icon;
        themeText.textContent = themes[theme].text;
        
        // localStorage에 저장
        localStorage.setItem('theme', theme);
        
        // Giscus 테마 변경
        updateGiscusTheme(effectiveTheme);
    }
    
    // Giscus 테마 변경
    function updateGiscusTheme(theme) {
        const giscusFrame = document.querySelector('iframe.giscus-frame');
        if (giscusFrame) {
            const customThemeUrl = 'https://zabocho.dev/assets/css/giscus-theme.css';
            giscusFrame.contentWindow.postMessage(
                { 
                    giscus: { 
                        setConfig: { 
                            theme: customThemeUrl + (theme === 'dark' ? '#dark' : '')
                        } 
                    } 
                },
                'https://giscus.app'
            );
        }
        
        // storage 이벤트 발생시켜 다른 탭에도 알림
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'theme',
            newValue: theme
        }));
    }
    
    // 드롭다운 토글
    themeToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        themeMenu.classList.toggle('hidden');
    });
    
    // 테마 선택
    themeButtons.forEach(button => {
        button.addEventListener('click', () => {
            const theme = button.dataset.theme;
            applyTheme(theme);
            themeMenu.classList.add('hidden');
        });
    });
    
    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', () => {
        themeMenu.classList.add('hidden');
    });
    
    // 시스템 테마 변경 감지
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const currentTheme = getCurrentTheme();
        if (currentTheme === 'system') {
            applyTheme('system');
        }
    });
    
    // 초기 테마 적용
    applyTheme(getCurrentTheme());
})();
