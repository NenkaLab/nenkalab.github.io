# Site settings
title: Zabocho
description: Zabocho(NenkaLab)의 블로그 입니다
url: "https://zabocho.dev"
baseurl: ""
github_url: "https://github.com/NenkaLab"

# Author
author:
  name: nenka.lab
  bio: Hello, World!
  image: https://github.com/NenkaLab.png
  email: mail@zabocho.dev

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable : true
permalink: /article/:title/

# Pagination
paginate: 10
paginate_path: "/article/page:num/"

# Related posts
lsi: false
related_posts_limit: 4

# Collections
collections:
  posts:
    output: true
    permalink: /article/:title/

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-youtube

urls:
  - key: "github"
    label: "GitHub"
    link: "https://github.com/NenkaLab"
  - key: "twitter"
    label: "Twitter"
    link: "https://twitter.com/zabocho"
  - key: "discord"
    label: "Discord"
    link: "https://discord.zabocho.dev"
    favicon: "https://discord.com"
  - key: "steam"
    label: "Steam"
    link: "https://steam.zabocho.dev"
    favicon: "https://steamcommunity.com/"
  - key: "email"
    label: "Email"
    link: "mailto:mail@zabocho.dev"

# Giscus settings (댓글 설정)
giscus:
  repo: "NenkaLab/nenkalab.github.io"
  repo_id: "MDEwOlJlcG9zaXRvcnkxOTg4MDExNzQ="  # https://giscus.app 에서 발급받으세요
  category: "General"
  category_id: "DIC_kwDOC9l3Fs4Cw0VV"  # https://giscus.app 에서 발급받으세요
  mapping: "pathname"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "top"
  strict: "1"
  lang: "ko"