---
layout: default
---

<article class="max-w-5xl mx-auto px-4 py-12 animate-fade-in-up">
    <!-- 글 헤더 -->
    <header class="mb-8">
        <h1 class="text-4xl text-zinc-900 dark:text-zinc-200 font-bold mb-4 break-words">{{ page.title }}</h1>
        <h3 class="text-2xl text-zinc-700 dark:text-zinc-400 mb-4 break-words">{{ page.description }}</h3>
        <div class="flex flex-wrap items-center gap-3 text-sm text-zinc-600 dark:text-zinc-400">
            <time datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%Y년 %-m월 %-d일 %H:%M:%S" }}
            </time>
            
            {% if page.last_modified_at %}
            <span>·</span>
            <time datetime="{{ page.last_modified_at | date_to_xmlschema }}" 
                class="inline-flex items-center gap-1 cursor-help hover:text-blue-600 dark:hover:text-blue-400 group transition-colors">
                <span class="group-hover:hidden">수정됨</span>
                <span class="hidden group-hover:inline whitespace-nowrap">
                    {{ page.last_modified_at | date: "%Y년 %-m월 %-d일 %H:%M:%S" }}
                </span>
            </time>
            {% endif %}
        </div>
    </header>
    
    <!-- 글 내용 -->
    <div class="utils prose prose-lg max-w-5xl text-zinc-900 dark:text-zinc-200">
        <style>
            .utils :where(img, video, iframe, embed, object) {
                max-width: 65ch;
                margin-left: auto;
                margin-right: auto;
            }

            .prose * {
                color: currentColor;
            }
        </style>
        {{ content }}
    </div>
</article>
