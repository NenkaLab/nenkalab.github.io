<script>
    (function() {
        const header = document.getElementById('main-header');
        const backButton = document.getElementById('back-button');
        let lastScrollY = window.scrollY;
        let ticking = false;
        
        // 뒤로가기 버튼 표시 로직
        if (window.history.length > 1) {
            backButton.classList.remove('hidden');
            backButton.classList.add('flex');
        }
        
        // 스크롤 이벤트 핸들러
        function updateHeader() {
            const scrollY = window.scrollY;
            
            // 50px 이상 스크롤시 작아진 헤더 적용
            if (scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScrollY = scrollY;
            ticking = false;
        }
        
        // 스크롤 이벤트 리스너 (requestAnimationFrame으로 최적화)
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateHeader);
                ticking = true;
            }
        });
        
        // 초기 상태 설정
        updateHeader();
    })();
</script>

<script>
(function() {
    let allPosts = [];
    let filteredPosts = [];
    let currentFilter = 'all';
    let currentPage = 1;
    const postsPerPage = 10;
    
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchCount = document.getElementById('search-count');
    const loading = document.getElementById('loading');
    const noResults = document.getElementById('no-results');
    const pagination = document.getElementById('pagination');
    const filterBtns = document.querySelectorAll('.filter-btn');
    
    // API에서 데이터 로드
    async function loadPosts() {
        loading.classList.remove('hidden');
        searchResults.innerHTML = '';
        noResults.classList.add('hidden');
        
        try {
            const response = await fetch('/api/search.json');
            allPosts = await response.json();
            filteredPosts = [...allPosts];
            
            searchCount.textContent = `전체 ${allPosts.length}개의 글`;
            displayResults();
        } catch (error) {
            console.error('Failed to load posts:', error);
            searchCount.textContent = '글을 불러오는데 실패했습니다';
        } finally {
            loading.classList.add('hidden');
        }
    }
    
    // 검색 함수
    function search(query) {
        const lowerQuery = query.toLowerCase().trim();
        
        if (!lowerQuery) {
            filteredPosts = [...allPosts];
            currentPage = 1;
            displayResults();
            return;
        }
        
        filteredPosts = allPosts.filter(post => {
            switch(currentFilter) {
                case 'title':
                    return post.title.toLowerCase().includes(lowerQuery);
                
                case 'date':
                    return post.date.includes(lowerQuery);
                
                case 'category':
                    return post.categories.some(cat => 
                        cat.toLowerCase().includes(lowerQuery)
                    );
                
                case 'tag':
                    return post.tags.some(tag => 
                        tag.toLowerCase().includes(lowerQuery)
                    );
                
                case 'all':
                default:
                    return post.title.toLowerCase().includes(lowerQuery) ||
                           post.date.includes(lowerQuery) ||
                           post.categories.some(cat => cat.toLowerCase().includes(lowerQuery)) ||
                           post.tags.some(tag => tag.toLowerCase().includes(lowerQuery));
            }
        });
        
        currentPage = 1;
        displayResults();
    }
    
    // 결과 표시
    function displayResults() {
        searchResults.innerHTML = '';
        
        const totalResults = filteredPosts.length;
        searchCount.textContent = `${totalResults}개의 검색 결과`;
        
        if (totalResults === 0) {
            noResults.classList.remove('hidden');
            pagination.classList.add('hidden');
            return;
        }
        
        noResults.classList.add('hidden');
        
        // 페이지네이션 계산
        const totalPages = Math.ceil(totalResults / postsPerPage);
        const startIdx = (currentPage - 1) * postsPerPage;
        const endIdx = startIdx + postsPerPage;
        const postsToShow = filteredPosts.slice(startIdx, endIdx);
        
        // 결과 렌더링
        postsToShow.forEach(post => {
            const article = document.createElement('article');
            article.className = 'card border border-gray-300 dark:border-gray-700 rounded-lg p-6 hover:border-blue-400 dark:hover:border-blue-500 hover:shadow-lg transition-all duration-300 bg-white dark:bg-gray-800 group hover:-translate-y-1 animate-element';
            
            const date = new Date(post.date);
            const formattedDate = `${date.getFullYear()}년 ${String(date.getMonth() + 1).padStart(2, '0')}월 ${String(date.getDate()).padStart(2, '0')}일`;
            
            article.innerHTML = `
                <a href="${post.url}" class="block">
                    <h3 class="text-xl font-semibold mb-2 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors truncate">
                        ${highlightText(post.title, searchInput.value)}
                    </h3>
                    <p class="text-gray-600 dark:text-gray-400 mb-3 line-clamp-2">
                        ${post.excerpt || ''}
                    </p>
                    <div class="flex items-center gap-3 text-sm text-gray-500 dark:text-gray-500">
                        <time>${formattedDate}</time>
                        ${post.categories && post.categories.length > 0 ? `
                            <span>·</span>
                            <div class="flex gap-2">
                                ${post.categories.slice(0, 2).map(cat => 
                                    `<span class="px-2 py-0.5 bg-gray-100 dark:bg-gray-700 rounded text-xs">${highlightText(cat, searchInput.value)}</span>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                </a>
            `;
            
            searchResults.appendChild(article);
        });
        
        // 페이지네이션 렌더링
        renderPagination(totalPages);
    }
    
    // 검색어 하이라이트
    function highlightText(text, query) {
        if (!query.trim()) return text;
        
        const regex = new RegExp(`(${query.trim()})`, 'gi');
        return text.replace(regex, '<mark class="bg-yellow-200 dark:bg-yellow-700">$1</mark>');
    }
    
    // 페이지네이션 렌더링
    function renderPagination(totalPages) {
        if (totalPages <= 1) {
            pagination.classList.add('hidden');
            return;
        }
        
        pagination.classList.remove('hidden');
        pagination.innerHTML = '';
        
        // 이전 버튼
        const prevBtn = document.createElement('button');
        prevBtn.className = currentPage === 1 
            ? 'px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-400 dark:text-gray-600 cursor-not-allowed'
            : 'px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 dark:hover:border-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all duration-200 hover:scale-105';
        prevBtn.textContent = '← 이전';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                displayResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        pagination.appendChild(prevBtn);
        
        // 페이지 번호들
        const pageNumbers = document.createElement('div');
        pageNumbers.className = 'flex gap-2';
        
        const maxVisible = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        
        if (endPage - startPage + 1 < maxVisible) {
            startPage = Math.max(1, endPage - maxVisible + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = i === currentPage
                ? 'px-4 py-2 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-lg font-semibold shadow-md'
                : 'px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 dark:hover:border-blue-400 transition-all duration-200 hover:scale-105';
            pageBtn.textContent = i;
            pageBtn.onclick = () => {
                currentPage = i;
                displayResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            pageNumbers.appendChild(pageBtn);
        }
        
        pagination.appendChild(pageNumbers);
        
        // 다음 버튼
        const nextBtn = document.createElement('button');
        nextBtn.className = currentPage === totalPages
            ? 'px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-gray-400 dark:text-gray-600 cursor-not-allowed'
            : 'px-4 py-2 border-2 border-gray-300 dark:border-gray-600 rounded-lg hover:border-blue-500 dark:hover:border-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950 transition-all duration-200 hover:scale-105';
        nextBtn.textContent = '다음 →';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                displayResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        pagination.appendChild(nextBtn);
    }
    
    // 디바운스 함수
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    
    // 이벤트 리스너
    searchInput.addEventListener('input', debounce((e) => {
        search(e.target.value);
    }, 300));
    
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            search(searchInput.value);
        });
    });
    
    // 초기 로드
    loadPosts();
})();
</script>
    </main>
    
    <footer class="border-t border-gray-200 dark:border-gray-700 mt-16">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-center text-sm text-gray-500 dark:text-gray-400">
                © 2025 Zabocho · Built with Jekyll & Tailwind CSS
            </p>
            
            <!-- 테마 스위처 -->
            <div class="relative">
                <button id="theme-toggle" 
                        class="flex items-center gap-2 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors text-sm">
                    <span id="theme-icon" class="material-symbols-outlined text-lg">light_mode</span>
                    <span id="theme-text" class="text-gray-700 dark:text-gray-300">라이트</span>
                    <span class="material-symbols-outlined text-lg text-gray-500">expand_more</span>
                </button>
                
                <!-- 드롭다운 메뉴 -->
                <div id="theme-menu" 
                     class="hidden absolute bottom-full mb-2 right-0 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-md shadow-lg min-w-[140px] z-10">
                    <button data-theme="light" 
                            class="w-full flex items-center gap-2 px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors text-left">
                        <span class="material-symbols-outlined text-lg">light_mode</span>
                        <span class="text-gray-700 dark:text-gray-300">라이트</span>
                    </button>
                    <button data-theme="dark" 
                            class="w-full flex items-center gap-2 px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors text-left">
                        <span class="material-symbols-outlined text-lg">dark_mode</span>
                        <span class="text-gray-700 dark:text-gray-300">다크</span>
                    </button>
                    <button data-theme="system" 
                            class="w-full flex items-center gap-2 px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors text-left rounded-b-md">
                        <span class="material-symbols-outlined text-lg">contrast</span>
                        <span class="text-gray-700 dark:text-gray-300">시스템</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</footer>

<script>
(function() {
    const themeToggle = document.getElementById('theme-toggle');
    const themeMenu = document.getElementById('theme-menu');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const themeButtons = document.querySelectorAll('[data-theme]');
    
    const themes = {
        light: { icon: 'light_mode', text: 'Light' },
        dark: { icon: 'dark_mode', text: 'Dark' },
        system: { icon: 'contrast', text: 'System' }
    };
    
    // 현재 테마 가져오기
    function getCurrentTheme() {
        return localStorage.getItem('theme') || 'system';
    }
    
    // 시스템 다크모드 감지
    function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    
    // 실제 적용될 테마 (system이면 시스템 설정 따름)
    function getEffectiveTheme(theme) {
        return theme === 'system' ? getSystemTheme() : theme;
    }
    
    // 테마 적용
    function applyTheme(theme) {
        const effectiveTheme = getEffectiveTheme(theme);
        
        if (effectiveTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        
        // UI 업데이트
        themeIcon.textContent = themes[theme].icon;
        themeText.textContent = themes[theme].text;
        
        // localStorage에 저장
        localStorage.setItem('theme', theme);
        
        // Giscus 테마 변경
        updateGiscusTheme(effectiveTheme);
    }
    
    // Giscus 테마 변경
    function updateGiscusTheme(theme) {
        const giscusFrame = document.querySelector('iframe.giscus-frame');
        if (giscusFrame) {
            const customThemeUrl = 'https://zabocho.dev/assets/css/giscus-theme.css';
            giscusFrame.contentWindow.postMessage(
                { 
                    giscus: { 
                        setConfig: { 
                            theme: customThemeUrl + (theme === 'dark' ? '#dark' : '')
                        } 
                    } 
                },
                'https://giscus.app'
            );
        }
        
        // storage 이벤트 발생시켜 다른 탭에도 알림
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'theme',
            newValue: theme
        }));
    }
    
    // 드롭다운 토글
    themeToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        themeMenu.classList.toggle('hidden');
    });
    
    // 테마 선택
    themeButtons.forEach(button => {
        button.addEventListener('click', () => {
            const theme = button.dataset.theme;
            applyTheme(theme);
            themeMenu.classList.add('hidden');
        });
    });
    
    // 외부 클릭 시 드롭다운 닫기
    document.addEventListener('click', () => {
        themeMenu.classList.add('hidden');
    });
    
    // 시스템 테마 변경 감지
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const currentTheme = getCurrentTheme();
        if (currentTheme === 'system') {
            applyTheme('system');
        }
    });
    
    // 초기 테마 적용
    applyTheme(getCurrentTheme());
})();
</script>
